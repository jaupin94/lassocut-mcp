# Publishes server.json to the official MCP registry (GitHub OIDC, no token). Runs after each release, or by hand.
name: MCP registry
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  registry:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
